[project]
name = "spot-scorer"
version = "0.1.0"
description = "Interactive scoring tool for Czech TV spots — drop-in companion to color-fingerprint-cz and sound-fingerprint-cz."
authors = [{ name = "Barbora Šandová" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.4",
    "yt-dlp>=2026.3.17",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "TID"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
